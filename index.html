<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Smart To-Do</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Animate.css -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />

  <!-- Oma CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="nature-overlay"></div>

  <main class="container app-container">
    <section class="hero-section text-center">
      <p class="small-title"><span class="title-symbol">🌿</span> Smart productivity app</p>
      <h1>Smart To-Do</h1>
      <p class="hero-text">
        Hallitse tehtäviä, määräaikoja ja muistutuksia.
      </p>
    </section>

    <section class="todo-card">
      <form id="taskForm">
        <div class="row g-3">
          <div class="col-12">
            <label for="taskInput" class="form-label"><span class="label-symbol">📝</span> Tehtävä</label>
            <input
              type="text"
              id="taskInput"
              class="form-control"
              placeholder="Kirjoita uusi tehtävä. Esim. pyykit, kauppalista tai työtehtävä"
              required
            />
          </div>

          <div class="col-md-4">
            <label for="taskDate" class="form-label"><span class="label-symbol">📅</span> Päivämäärä</label>
            <input type="date" id="taskDate" class="form-control" />
          </div>

          <div class="col-md-4">
            <label for="taskTime" class="form-label"><span class="label-symbol">⏰</span> Kellonaika</label>
            <input type="time" id="taskTime" class="form-control" />
          </div>

          <div class="col-md-4">
            <label for="taskPriority" class="form-label"><span class="label-symbol">🔥</span> Prioriteetti</label>
            <select id="taskPriority" class="form-select">
              <option value="low">Matala</option>
              <option value="normal" selected>Normaali</option>
              <option value="high">Korkea</option>
            </select>
          </div>

          <div class="col-md-5">
            <label for="taskSound" class="form-label"><span class="label-symbol">🔔</span> Muistutusääni</label>
            <select id="taskSound" class="form-select">
              <option value="soft">Pehmeä ilmoitus</option>
              <option value="forest">Lintujen laulu</option>
              <option value="alarm">Hälytys</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="taskCategory" class="form-label"><span class="label-symbol">🏷️</span> Kategoria</label>
            <select id="taskCategory" class="form-select"></select>
          </div>

          <div class="col-md-3 d-flex align-items-end">
            <button type="button" id="manageCategoriesBtn" class="btn category-btn w-100">
              🗂️ Kategoriat
            </button>
          </div>

          <div class="col-12">
            <button type="submit" class="btn add-btn w-100">
              ➕ Lisää tehtävä
            </button>
          </div>
        </div>
      </form>
    </section>

    <section class="control-card">
      <div class="row g-3 align-items-center">
        <div class="col-md-8">
          <div class="filter-buttons">
            <button type="button" class="filter-btn active" data-filter="all">🌿 Kaikki</button>
            <button type="button" class="filter-btn" data-filter="active">⏳ Kesken</button>
            <button type="button" class="filter-btn" data-filter="completed">✅ Valmiit</button>
            <button type="button" class="filter-btn" data-filter="high">🔥 Tärkeät</button>
          </div>

          <div class="category-filter-box">
            <label for="categoryFilter" class="category-filter-label"><span class="label-symbol">🔎</span> Suodata kategorialla</label>
            <select id="categoryFilter" class="form-select category-filter-select"></select>
          </div>
        </div>

        <div class="col-md-4 text-md-end history-actions">
          <button type="button" id="showHistoryBtn" class="btn history-btn">
            📜 Tehtävähistoria
          </button>

          <button type="button" id="clearCompletedBtn" class="btn clear-btn">
            🧹 Poista valmiit
          </button>
        </div>
      </div>
    </section>

    <section class="stats-section">
      <div class="stat-box">
        <span id="totalTasks">0</span>
        <p><span class="stat-symbol">📋</span> Tehtävää</p>
      </div>

      <div class="stat-box">
        <span id="activeTasks">0</span>
        <p><span class="stat-symbol">⏳</span> Kesken</p>
      </div>

      <div class="stat-box">
        <span id="completedTasks">0</span>
        <p><span class="stat-symbol">✅</span> Valmiina</p>
      </div>
    </section>

    <section class="tasks-section">
      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state">
        <h2><span class="empty-symbol">🍃</span> Ei tehtäviä</h2>
        <p>Lisää ensimmäinen tehtävä ja aloita rauhallisesti.</p>
      </div>
    </section>

    <section class="motivation-card">
      <div class="motivation-header">
        <div>
          <p class="small-title motivation-small-title">✨ Päivän inspiraatio</p>
          <h2>🌻 Motivaatiovinkki</h2>
        </div>

        <button type="button" id="refreshQuoteBtn" class="btn quote-btn">
          🔄 Hae uusi
        </button>
      </div>

      <blockquote id="quoteText" class="quote-text">
        Haetaan inspiraatiolausetta...
      </blockquote>

      <p id="quoteAuthor" class="quote-author"></p>
      <p class="quote-source-text">
      </p>
    </section>
  </main>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Day.js -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Howler.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Oma JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
